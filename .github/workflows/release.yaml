name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Should be semver. Example "1.2.3"'
        required: true
        type: string

permissions:
  packages: write           # Required for push to GHCR
  contents: write           # Required to create a release and upload artifacts
#  attestations: write       # Required for Docker image attestation (public repos only)
#  id-token: write           # OIDC for cosign keyless + attestations (public repos only)

env:
  DOCKER_IMAGE_NAME: ghcr.io/your-ko/mcp-k8s-ro
  GITHUB_REPOSITORY: your-ko/mcp-k8s-ro

jobs:
  build-binaries:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - os: linux
            arch: amd64
          - os: linux
            arch: arm64
          - os: darwin
            arch: amd64
          - os: darwin
            arch: arm64
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: './go.mod'
          cache-dependency-path: './go.sum'

      - name: Go Test
        if: matrix.os == 'linux' && matrix.arch == 'amd64'
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          go test -race ./cmd/... ./internal/...

      - name: Generate build timestamp
        id: timestamp
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: 0
        run: |
          go build \
            -ldflags "-X main.GitCommit=${{ github.sha }} \
                      -X main.BuildDate=${{ steps.timestamp.outputs.BUILD_DATE }} \
                      -X main.Version=${{ inputs.version }}" \
            -o mcp-k8s-ro \
            ./cmd/mcp-k8s-ro/

      - name: Package artifact
        run: |
          ARCHIVE="mcp-k8s-ro-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.zip"
          zip "$ARCHIVE" mcp-k8s-ro README.md LICENSE
          echo "ARCHIVE=$ARCHIVE" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: mcp-k8s-ro-${{ matrix.os }}-${{ matrix.arch }}
          path: mcp-k8s-ro-${{ inputs.version }}-${{ matrix.os }}-${{ matrix.arch }}.zip

  build-docker:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.docker.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Docker login
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate build timestamp
        id: timestamp
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Docker meta
        uses: docker/metadata-action@v6.0.0
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha256-,format=long
#            org.opencontainers.image.licenses=MIT
          labels: |
            org.opencontainers.image.title=mcp-k8s-ro
            org.opencontainers.image.description=Read-only MCP server for Kubernetes
            org.opencontainers.image.url=https://github.com/your-ko/mcp-k8s-ro
            org.opencontainers.image.source=https://github.com/your-ko/mcp-k8s-ro
            org.opencontainers.image.vendor=your-ko
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build image
        id: docker
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            BUILD_DATE=${{ steps.timestamp.outputs.BUILD_DATE }}
            GIT_COMMIT=${{ github.sha }}
#          provenance: mode=max   # requires public repo or GitHub Advanced Security
#          sbom: true             # requires public repo or GitHub Advanced Security
          push: true

#  sign:
#    # Cosign keyless signing uses Sigstore public Rekor log — requires public repo
#    runs-on: ubuntu-24.04
#    needs: build-docker
#    steps:
#      - name: Login to GHCR
#        uses: docker/login-action@v3.7.0
#        with:
#          registry: ghcr.io
#          username: ${{ github.actor }}
#          password: ${{ secrets.GITHUB_TOKEN }}
#
#      - name: Install cosign
#        uses: sigstore/cosign-installer@v4.1.0
#
#      - name: Keyless sign image (Sigstore)
#        env:
#          DIGEST: ${{ needs.build-docker.outputs.digest }}
#        run: |
#          cosign sign --yes ${{ env.DOCKER_IMAGE_NAME }}@${{env.DIGEST}}
#
#      - name: Verify signature
#        env:
#          DIGEST: ${{ needs.build-docker.outputs.digest }}
#        run: |
#          cosign verify "${{env.DOCKER_IMAGE_NAME}}@${{env.DIGEST}}" \
#            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#            --certificate-identity-regexp "^https://github.com/your-ko/mcp-k8s-ro/\.github/workflows/.*"

  release:
    runs-on: ubuntu-24.04
    needs: [ build-binaries, build-docker ]
    steps:
      - uses: actions/checkout@v6.0.2

      - name: Download all artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          path: artifacts/
          pattern: mcp-k8s-ro-*

      - name: Create/Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --generate-notes --latest
          else
            gh release create "$TAG" --generate-notes --latest
          fi

          find artifacts/ -name "*.zip" | xargs gh release upload "$TAG" --clobber
