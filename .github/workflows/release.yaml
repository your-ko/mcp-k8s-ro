name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version. Should be semver. Example "1.2.3"'
        required: true
        type: string

permissions:
  packages: write           # Required for push to GHCR
  contents: write           # Required to create a release with notes
#  attestations: write       # Required for Docker image attestation (public repos only)
#  id-token: write           # OIDC for cosign keyless + attestations (public repos only)

env:
  DOCKER_IMAGE_NAME: ghcr.io/your-ko/mcp-k8s-ro
  GITHUB_REPOSITORY: your-ko/mcp-k8s-ro

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      digest: ${{ steps.docker.outputs.digest }}
    steps:
      - uses: actions/checkout@v6.0.2
      - name: SetUp
        run: |
          git config --local user.name  "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.12.0

      - name: Docker login
        uses: docker/login-action@v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-go@v6.3.0
        with:
          go-version-file: './go.mod'
          cache-dependency-path: './go.sum'

      - name: Go Test
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
           go test -race ./cmd/... ./internal/...

      - name: Generate build timestamp
        id: timestamp
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Docker meta
        uses: docker/metadata-action@v5.10.0
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest
            type=sha,prefix=sha256-,format=long
#            org.opencontainers.image.licenses=MIT
          labels: |
            org.opencontainers.image.title=mcp-k8s-ro
            org.opencontainers.image.description=Read-only MCP server for Kubernetes
            org.opencontainers.image.url=https://github.com/your-ko/mcp-k8s-ro
            org.opencontainers.image.source=https://github.com/your-ko/mcp-k8s-ro
            org.opencontainers.image.vendor=your-ko
            org.opencontainers.image.version=${{ inputs.version }}
            org.opencontainers.image.created=${{ steps.timestamp.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build image
        id: docker
        uses: docker/build-push-action@v6.19.2
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.version }}
            BUILD_DATE=${{ steps.timestamp.outputs.BUILD_DATE }}
            GIT_COMMIT=${{ github.sha }}
#          provenance: mode=max   # requires public repo or GitHub Advanced Security
#          sbom: true             # requires public repo or GitHub Advanced Security
          push: true

