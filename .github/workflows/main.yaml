name: Main

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main

permissions:
  contents: read
  packages: write

env:
  DOCKER_IMAGE_NAME: ghcr.io/your-ko/mcp-k8s-ro

jobs:
  Main:
    name: Main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-go@v6.4.0
        with:
          go-version-file: './go.mod'
          cache-dependency-path: './go.sum'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.0.0

      - name: Docker login
        uses: docker/login-action@v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Go Vet
        shell: bash
        run: |
          go vet ./cmd/... ./internal/...

      - name: Go Test
        shell: bash
        env:
          CGO_ENABLED: 1
        run: |
          go test -race ./cmd/... ./internal/...

      - name: Generate build timestamp
        id: timestamp
        run: echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_OUTPUT

      - name: Docker meta
        uses: docker/metadata-action@v6.0.0
        id: meta
        with:
          images: ${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha256-
            type=ref,event=branch,prefix=branch-
#            org.opencontainers.image.licenses=MIT
          labels: |
            org.opencontainers.image.title=mcp-k8s-ro
            org.opencontainers.image.description=Read-only MCP server for Kubernetes
            org.opencontainers.image.url=https://github.com/your-ko/mcp-k8s-ro
            org.opencontainers.image.source=https://github.com/your-ko/mcp-k8s-ro
            org.opencontainers.image.vendor=your-ko
            org.opencontainers.image.created=${{ steps.timestamp.outputs.BUILD_DATE }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Build image
        uses: docker/build-push-action@v7.0.0
        with:
          context: .
          file: Dockerfile
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=branch-${{ github.ref_name }}
            BUILD_DATE=${{ steps.timestamp.outputs.BUILD_DATE }}
            GIT_COMMIT=${{ github.sha }}
          provenance: false
          push: false
